# clamd configuration for the mcp-clamav stack.
# Mounted read-only over /etc/clamav/clamd.conf in the official clamav/clamav image.
# Reference: https://docs.clamav.net/manual/Usage/Configuration.html

Foreground yes
# No LogFile: with "Foreground yes" clamd logs to stdout, so the container can run read-only.
LogTime yes
LogClean no
LogVerbose no
# Adds the matched file size and hash to "FOUND" log lines.
ExtendedDetectionInfo yes

DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
# The image entrypoint waits for this socket before declaring clamd started.
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
# Reachable only on the internal "scan" network; never publish this port.
TCPSocket 3310

# Connection handling
MaxThreads 8
MaxQueue 64
MaxConnectionQueueLength 32
CommandReadTimeout 10
ReadTimeout 60
IdleTimeout 30
SendBufTimeout 500

# Scan limits. Anything beyond them is reported as Heuristics.Limits.Exceeded.*
# (AlertExceedsMax) instead of silently passing as clean.
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 400M
MaxRecursion 17
MaxFiles 10000
MaxScanTime 120000
PCREMaxFileSize 100M
AlertExceedsMax yes

# Detection
HeuristicAlerts yes
BytecodeSecurity TrustSigned
DetectPUA no

# Keep serving scans while freshclam-triggered reloads happen in the background.
ConcurrentDatabaseReload yes
# Re-check the database directory every 10 minutes (catches updates freshclam could not notify,
# e.g. the first download racing clamd start-up).
SelfCheck 600
