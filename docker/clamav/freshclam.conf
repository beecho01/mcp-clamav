# freshclam configuration for the mcp-clamav stack.
# Mounted read-only over /etc/clamav/freshclam.conf in the official clamav/clamav image.
# Reference: https://docs.clamav.net/manual/Usage/SignatureManagement.html

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
LogTime yes
# Log to stdout only (no UpdateLogFile), so the container can run read-only.
Foreground yes
NotifyClamd /etc/clamav/clamd.conf
ConnectTimeout 30
ReceiveTimeout 60
