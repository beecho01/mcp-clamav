[project]
name = "clamav-mcp"
version = "1.0.0"
description = "Hardened Model Context Protocol server that scans files for malware with ClamAV"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    # 2.x implements MCP 2026-07-28 (stateless requests, server/discover) and still serves older clients.
    "mcp>=2.3.0,<3",
    "anyio>=4.9",
    "pydantic>=2.12",
    "pyjwt[crypto]>=2.10.1",
    "starlette>=0.48",
    "uvicorn>=0.31.1",
]

[project.scripts]
clamav-mcp = "clamav_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clamav_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a running clamd (set CLAMAV_MCP_TEST_CLAMD=host:port)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
